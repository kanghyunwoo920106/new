name: Schedule check

# Confirms GitHub creates a schedule run. This job does not publish a post.
# 14:28 UTC runs only on 7 October. 14:40 UTC is a plain daily cron.
on:
  schedule:
    - cron: "28 14 7 10 *"
    - cron: "40 14 * * *"
  push:
    branches: [master]
    paths:
      - ".github/workflows/clock-check.yml"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record that the schedule fired
        run: |
          date -u
          echo "event=${{ github.event_name }}"
