name: Schedule check

# Confirms GitHub creates a schedule run. This job does not publish a post.
# These three times run only on 7 October, shortly after this file is added.
# A follow-up commit asks GitHub to resync the schedule list.
on:
  schedule:
    - cron: "58 13 7 10 *"
    - cron: "13 14 7 10 *"
    - cron: "28 14 7 10 *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record that the schedule fired
        run: date -u
