name: Blogger autopost

# GitHub cron is UTC. Minute 0 and a single combined list were not creating runs.
# Each Seoul slot gets two separate schedules: :11 and :41.
# 00:11/00:41 UTC = 09:11/09:41 KST, then 12:11/12:41, 15:11/15:41, 18:11/18:41.
# The publisher skips the second attempt when a live post is under 2 hours old.
on:
  schedule:
    - cron: "11 0 * * *"
    - cron: "41 0 * * *"
    - cron: "11 3 * * *"
    - cron: "41 3 * * *"
    - cron: "11 6 * * *"
    - cron: "41 6 * * *"
    - cron: "11 9 * * *"
    - cron: "41 9 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: apps/api
        run: uv sync --frozen
      - name: Publish one random post
        working-directory: apps/api
        env:
          AUTOPILOT_ENABLED: "true"
          AUTOPILOT_CHANNELS: blogger
          SCHEDULER_BACKEND: apscheduler
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          REFERENCE_LINKS: ${{ secrets.REFERENCE_LINKS }}
        run: uv run python -m autopost_api.services.autopilot
      - name: Upload paste HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paste-html
          path: paste/*.html
          if-no-files-found: ignore
      - name: Commit new paste HTML
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paste
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add paste HTML for the latest Blogger post."
          for _ in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
          done
          exit 1
