name: Blogger autopost

# GitHub cron is UTC, and it often drops jobs scheduled at minute 0.
# Each Seoul slot therefore gets two automatic attempts: :08 and :38.
# 00:08/00:38 UTC = 09:08/09:38 KST, then 12:08/12:38, 15:08/15:38, 18:08/18:38.
# The publisher skips the second attempt when a live post is under 2 hours old.
on:
  schedule:
    - cron: "8,38 0 * * *"
    - cron: "8,38 3 * * *"
    - cron: "8,38 6 * * *"
    - cron: "8,38 9 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: apps/api
        run: uv sync --frozen
      - name: Publish one random post
        working-directory: apps/api
        env:
          AUTOPILOT_ENABLED: "true"
          AUTOPILOT_CHANNELS: blogger
          SCHEDULER_BACKEND: apscheduler
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          REFERENCE_LINKS: ${{ secrets.REFERENCE_LINKS }}
        run: uv run python -m autopost_api.services.autopilot
