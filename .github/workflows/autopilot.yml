name: Blogger autopost

# GitHub cron is UTC. These four lines are 09:00, 12:00, 15:00, and 18:00 in Asia/Seoul.
# Hosted runners stay up when a laptop is off. Each run publishes one post.
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: apps/api
        run: uv sync --frozen
      - name: Publish one random post
        working-directory: apps/api
        env:
          AUTOPILOT_ENABLED: "true"
          AUTOPILOT_CHANNELS: blogger
          SCHEDULER_BACKEND: apscheduler
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: uv run python -m autopost_api.services.autopilot
