name: Daily Blogger autopost

# 00:00 UTC = 09:00 Asia/Seoul. GitHub-hosted runners stay up when a laptop is off.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: apps/api
        run: uv sync --frozen
      - name: Publish one random post
        working-directory: apps/api
        env:
          AUTOPILOT_ENABLED: "true"
          AUTOPILOT_CHANNELS: blogger
          SCHEDULER_BACKEND: apscheduler
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: uv run python -m autopost_api.services.autopilot
