name: Schedule check

# Confirms GitHub creates a schedule run. This job does not publish a post.
# 09:05 UTC is 18:05 KST, just before the 18:11 post attempt.
on:
  schedule:
    - cron: "5 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record that the schedule fired
        run: date -u
