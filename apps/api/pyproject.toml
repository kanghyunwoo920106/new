[project]
name = "autopost-api"
version = "0.1.0"
description = "LumenPost Phase 1 API — AI own-site auto publishing"
readme = "README.md"
authors = [
    { name = "Cursor Agent", email = "cursoragent@cursor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.11.0",
    "apscheduler>=3.11.3",
    "celery[redis]>=5.6.3",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "markdown>=3.11",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "python-slugify>=9.1.2",
    "redis>=6.4.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
autopost-api = "autopost_api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
